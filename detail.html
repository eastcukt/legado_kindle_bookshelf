<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <title>kindle阅读</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }

        a {
            text-decoration: none;
        }

        .main-text {
            font-size: 1.62rem;
        }

        #content1 {
            padding: 0 20px;
            text-align: justify;
            height: 250px;
            overflow: hidden;
        }

        #content1 p {
            margin: 0;
            line-height: 2.4rem;
        }

        #content1 .chapter-title {
            margin: 0 0 1.2em 0;
            font-size: 1.45em;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
        }

        .menu {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            background: #fff;
            padding: 20px;
            border-top: 1px solid #ddd;
            width: 100%;
            box-sizing: border-box;
        }

        .menu div {
            float: left;
            padding-left: 40px;
        }

        .chapter-list {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: none;
            max-height: 70vh;
            overflow: auto;
            border-bottom: 1px solid #ddd;
        }

        .chapter-list p {
            padding: 10px;
            margin: 0;
        }

        .settings-panel {
            display: none;
            position: fixed;
            right: 20px;
            bottom: 90px;
            width: 280px;
            background: #fff;
            border: 1px solid #ddd;
            padding: 16px;
            box-sizing: border-box;
        }

        .settings-panel .row {
            overflow: hidden;
            margin-bottom: 12px;
        }

        .settings-panel .row:last-child {
            margin-bottom: 0;
        }

        .settings-panel .label {
            float: left;
            line-height: 36px;
        }

        .settings-panel .controls {
            float: right;
        }

        .settings-panel .value {
            display: inline-block;
            min-width: 72px;
            text-align: center;
        }

        .settings-panel button {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 20px;
        }
    </style>
</head>

<body>
<div id="page">
    <div id="mainText" class="main-text">
        <div id="content1"></div>
        <div class="chapter-list"></div>
        <div class="settings-panel" id="settingsPanel">
            <div class="row">
                <span class="label">Font Size</span>
                <span class="controls">
                    <button type="button" onclick="changeFontSize(-1, event)">-</button>
                    <span class="value" id="fontSizeValue"></span>
                    <button type="button" onclick="changeFontSize(1, event)">+</button>
                </span>
            </div>
            <div class="row">
                <span class="label">Line Height</span>
                <span class="controls">
                    <button type="button" onclick="changeLineHeight(-1, event)">-</button>
                    <span class="value" id="lineHeightValue"></span>
                    <button type="button" onclick="changeLineHeight(1, event)">+</button>
                </span>
            </div>
        </div>
        <div class="menu">
            <div onclick="jump('book.html')">书架</div>
            <div onclick="toggleSettings(event)">设置</div>
            <div onclick="openChapterList(event)">目录</div>
            <div onclick="prev(event)">上一章</div>
            <div onclick="next(event)">下一章</div>
        </div>
    </div>
</div>
<script src="./jquery-2.2.4.min.js?v1"></script>
<script src="./book.js?v5"></script>
<script>
    var menu = false;

    initReaderSettings();
    getBookContent('next');
    getChapterList();

    var contentNode = $$('#content1');
    var windowHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    var contentHeight = windowHeight - 55;
    contentNode.style.height = contentHeight + 'px';

    var containerRect = contentNode.getBoundingClientRect();
    var nextX = Math.floor(containerRect.right - containerRect.width * 0.3);
    var prevX = Math.floor(containerRect.left + containerRect.width * 0.3);

    document.addEventListener('click', function (event) {
        if (isInsideClass(event.target, 'menu') ||
            isInsideClass(event.target, 'chapter-list') ||
            isInsideClass(event.target, 'settings-panel')) {
            return;
        }

        var x = event.clientX;
        var previousScrollTop = contentNode.scrollTop;
        if (x > nextX) {
            contentNode.scrollTop += (contentHeight - 20);
            page('next', previousScrollTop);
        } else if (x < prevX) {
            contentNode.scrollTop -= (contentHeight - 20);
            page('prev', previousScrollTop);
        } else {
            if (menu) {
                hideMenu();
            } else {
                showMenu();
            }
        }
    }, false);

    function page(direction, previousScrollTop) {
        var currentScrollTop = contentNode.scrollTop;

        if (currentScrollTop !== previousScrollTop) {
            if (direction === 'next' && isBottomReached(contentNode)) {
                config.boundaryDirection = 'next';
            } else if (direction === 'prev' && isTopReached(contentNode)) {
                config.boundaryDirection = 'prev';
            } else {
                resetBoundaryState();
            }
            config.contentHeight = currentScrollTop;
            return;
        }

        if (direction === 'next' && isBottomReached(contentNode)) {
            if (config.boundaryDirection === 'next') {
                next();
                return;
            }
            config.boundaryDirection = 'next';
        } else if (direction === 'prev' && isTopReached(contentNode)) {
            if (config.boundaryDirection === 'prev') {
                prev();
                return;
            }
            config.boundaryDirection = 'prev';
        } else {
            resetBoundaryState();
        }

        config.contentHeight = currentScrollTop;
    }

    function showMenu() {
        $$('.menu')[0].style.display = 'block';
        menu = true;
    }

    function hideMenu() {
        $$('.menu')[0].style.display = 'none';
        hideSettings();
        menu = false;
    }

    function isInsideClass(node, className) {
        while (node) {
            if (node.className && typeof node.className === 'string') {
                if ((' ' + node.className + ' ').indexOf(' ' + className + ' ') > -1) {
                    return true;
                }
            }
            node = node.parentNode;
        }
        return false;
    }
</script>
</body>

</html>
